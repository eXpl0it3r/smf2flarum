name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Linux, os: ubuntu-26.04, rid: linux-x64 }
          - { name: Windows, os: windows-2025, rid: win-x64 }
          - { name: macOS, os: macos-26, rid: osx-arm64 }
        dotnet:
          - { name: .NET 10, version: "10.0.x" }

    steps:
      - name: Check out smf2flarum
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET ${{ matrix.dotnet.version }} SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK Version
        env:
          DOTNET_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --force
      - name: Verify SDK Installation
        run: dotnet --info
        continue-on-error: true

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Publish
        env:
          RID: ${{ matrix.platform.rid }}
        run: dotnet publish --configuration Release --output publish --self-contained true --runtime "$RID" -p:PublishReadyToRun=true -p:PublishSingleFile=true src/smf2flarum/smf2flarum.csproj

      - name: Upload smf2flarum
        uses: actions/upload-artifact@v7
        with:
          name: smf2flarum-${{ matrix.platform.rid }}
          path: publish
